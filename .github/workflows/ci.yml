# Runs the same checks as `make test` and `make lint` on every PR and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: make install

      # npm ci rather than `make install-all`'s npm install: it installs exactly
      # the lockfile and fails if package.json and the lockfile disagree.
      - name: Install frontend
        run: npm ci --prefix frontend

      # `make -k` runs every target even after one fails, so a single run shows
      # failing tests and lint errors together. Make still exits non-zero.
      - name: Test and lint
        run: make -k test lint
