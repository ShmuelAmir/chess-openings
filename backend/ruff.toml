# Ruff lints and formats the backend. `make lint` checks, `make format` rewrites.

# Matches PYTHON_VERSION in render.yaml.
target-version = "py311"
extend-exclude = ["venv"]

[lint]
# Pyflakes, the pycodestyle errors that don't fight the formatter, and import
# sorting. Listed explicitly because ruff's default set grows between releases.
select = ["E4", "E7", "E9", "F", "I"]
